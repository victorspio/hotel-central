[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,backend/.env.example,frontend/.env.example"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", ".prisma", "prisma"]
  included_files = ["backend/prisma/**", "node_modules/.prisma/**", "backend/node_modules/.prisma/**"]

# API requests route to the serverless backend function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single Page Application (SPA) router fallback for React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

